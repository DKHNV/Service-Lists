<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <title>Service Lists</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M8 9h16M9.5 11.6l5 10M22.5 11.6l-5 10' fill='none' stroke='%2358a6ff' stroke-width='2.1' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='9' r='3' fill='%23161b22' stroke='%2358a6ff' stroke-width='2'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23161b22' stroke='%2358a6ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='24' r='3' fill='%23161b22' stroke='%233fb950' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html" aria-label="Service Lists">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M8 9h16M9.5 11.6l5 10M22.5 11.6l-5 10" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="8" cy="9" r="3" fill="#161b22" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="9" r="3" fill="#161b22" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="24" r="3" fill="#161b22" stroke="#3fb950" stroke-width="2"/></svg>
        </span>
        <span>Service Lists</span>
      </a>
      <nav aria-label="Основная навигация">
        <a href="index.html">Сервисы</a>
        <a href="https://github.com/DKHNV" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="shell" data-service-page>
    <div class="page-head">
      <div>
        <h1 data-service-name>Загрузка…</h1>
        <p class="subtitle"><span data-service-repo class="mono"></span> · публичные исходные списки</p>
      </div>
      <div class="button-row">
        <a class="button" data-repo-link target="_blank" rel="noopener noreferrer">Открыть репозиторий</a>
      </div>
    </div>

    <div data-fatal class="notice" hidden></div>
    <div data-warning class="notice" hidden></div>

    <div class="summary-grid">
      <div class="summary-item"><div class="summary-label">CIDR</div><div class="summary-value" data-stat-cidr>—</div></div>
      <div class="summary-item"><div class="summary-label">RouterOS</div><div class="summary-value" data-stat-routeros>—</div></div>
      <div class="summary-item"><div class="summary-label">DNS</div><div class="summary-value" data-stat-dns>—</div></div>
      <div class="summary-item"><div class="summary-label">Последнее обновление</div><div class="summary-value small" data-updated>Получаем дату…</div></div>
    </div>

    <section class="section">
      <div class="section-head"><h2>Файлы</h2><span class="muted small">Только чтение</span></div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="cidr" type="button">CIDR</button>
        <button class="tab" data-tab="routeros" type="button">RouterOS</button>
        <button class="tab" data-tab="dns" type="button">DNS</button>
      </div>

      <div class="file-box" data-panel="cidr">
        <div class="file-head">
          <span class="file-name" data-file-name></span>
          <div class="button-row"><button type="button" data-download disabled>↓ Скачать</button><a class="button" data-raw target="_blank" rel="noopener noreferrer">Raw</a></div>
        </div>
        <pre>Загрузка…</pre>
      </div>

      <div class="file-box" data-panel="routeros" hidden>
        <div class="file-head">
          <span class="file-name" data-file-name></span>
          <div class="button-row"><button type="button" data-download disabled>↓ Скачать</button><a class="button" data-raw target="_blank" rel="noopener noreferrer">Raw</a></div>
        </div>
        <pre>Загрузка…</pre>
      </div>

      <div class="file-box" data-panel="dns" hidden>
        <div class="file-head">
          <span class="file-name" data-file-name></span>
          <div class="button-row"><button type="button" data-download disabled>↓ Скачать</button><a class="button" data-raw target="_blank" rel="noopener noreferrer">Raw</a></div>
        </div>
        <pre>Загрузка…</pre>
      </div>
    </section>
  </main>

  <footer class="shell">
    <div class="footer-inner">
      <span>Service Lists <strong>v1.0.0</strong></span>
      <a class="creator" href="https://github.com/DKHNV" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.5 11.5 0 0 0 8.36 23.1c.58.1.79-.25.79-.56v-2.18c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.75.41-1.27.74-1.56-2.57-.29-5.27-1.29-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18A10.9 10.9 0 0 1 12 6.15c.98 0 1.96.13 2.88.39 2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.22c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
        <span>Создано DKHNV</span>
      </a>
    </div>
  </footer>
</body>
</html>
